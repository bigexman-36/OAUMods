name: OAUMods checks

on:
  pull_request:
    paths:
      - "oaumods/**"
      - ".github/workflows/oaumods-checks.yml"
  push:
    branches:
      - main
    paths:
      - "oaumods/**"
      - ".github/workflows/oaumods-checks.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oaumods
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oaumods/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js app
        run: npm run build
